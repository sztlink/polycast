<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Polycast</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="logo">⬡ polycast</div>
    <div class="master-status">
      <span id="master-state" class="badge">stopped</span>
      <span id="master-tc" class="timecode">0:00:00</span>
    </div>
  </header>

  <main>
    <section class="controls">
      <button id="btn-play"    class="btn btn-primary">▶ Play All</button>
      <button id="btn-pause"   class="btn">⏸ Pause All</button>
      <button id="btn-sync"    class="btn">⟳ Sync All</button>
      <button id="btn-restart" class="btn btn-danger">↺ Seek 0</button>
    </section>

    <section class="nodes" id="nodes-grid">
      <div class="empty-state">Waiting for nodes to connect…</div>
    </section>
  </main>

  <footer>
    <span id="connection-status" class="conn-dot disconnected">●</span>
    <span id="connection-label">connecting to master…</span>
  </footer>

  <script src="app.js"></script>
</body>
</html>
