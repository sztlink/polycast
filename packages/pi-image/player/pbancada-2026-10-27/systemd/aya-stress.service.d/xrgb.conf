[Unit]
Description=aya-player teste de estresse (P04 e P06 definitivos em loop, HDMI travado no fps do video, overlay, audio no fone)

[Service]
ExecStart=
ExecStart=/usr/local/bin/aya-player-lista /var/lib/aya-player/conteudo/lista.m3u --hwdec=v4l2m2m --drm-drmprime-video-plane=primary --drm-draw-plane=overlay --audio-device=alsa/plughw:CARD=Headphones --volume=70 --input-ipc-server=/run/aya-stress/mpv.sock --msg-level=all=warn --osd-level=0 --no-osc --load-scripts=no --audio-format=s16 --cache=no
